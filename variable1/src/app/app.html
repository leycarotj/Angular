<img src="https://img.magnific.com/vector-gratis/diseno-fondo-terracota-acuarela_23-2149536606.jpg?semt=ais_hybrid&w=740&q=80"class = "fondo-pantalla" alt="fondo">
<h1>Lista de productos</h1>

<div class="tarjeta">

  @for (producto of productos; track producto.nombre) {

    <div class="producto">

      <h2>{{ producto.nombre }}</h2>

      <p>Precio: ${{ producto.precio }}</p>

      <button (click)="seleccionarProducto(producto)">
        Seleccionar
      </button>

    </div>

  }

</div>

@if (mensaje) {
  <h2>{{ mensaje }}</h2>
}
